<style>
:root{--ink:#111316;--mut:#7c8087;--line:#e9e9e4;--soft:#f6f6f3;--ok:#1f8a5b;--okbg:#e9f6ef;--warn:#a96a00;--warnbg:#fff4de;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
body.oc{margin:0;background:#f6f6f3;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.oc-i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.oc-wrap{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:150px 0 90px}
/* hero */
.oc-hero{text-align:center;padding:26px 0 10px}
.oc-tick{width:96px;height:96px;margin:0 auto 22px;position:relative}
.oc-tick svg{width:100%;height:100%;overflow:visible}
.oc-tick .ring{fill:var(--okbg);stroke:none;transform-origin:center;animation:ocPop .6s var(--ease) both}
.oc-tick .circ{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:289;animation:ocDraw .8s .1s var(--ease) forwards}
.oc-tick .chk{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:ocDraw .5s .7s var(--ease) forwards}
.oc-tick.wait .ring{fill:var(--warnbg)}.oc-tick.wait .circ,.oc-tick.wait .chk{stroke:var(--warn)}
.oc-hero h1{margin:0;font-family:'Unbounded',Inter,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(24px,5vw,40px);line-height:1.05;animation:ocUp .7s .3s var(--ease) both}
.oc-hero p{margin:12px auto 0;max-width:520px;color:var(--mut);font-size:15px;line-height:1.6;animation:ocUp .7s .4s var(--ease) both}
.oc-ref{display:inline-flex;align-items:center;gap:10px;margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 12px 10px 18px;font-size:13px;box-shadow:0 14px 30px -20px rgba(20,24,30,.3);animation:ocUp .7s .5s var(--ease) both}
.oc-ref small{color:var(--mut);font-weight:600}.oc-ref b{letter-spacing:.04em}
.oc-ref button{border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.oc-ref button .oc-i{width:15px;height:15px}
/* grid */
.oc-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;margin-top:30px;align-items:start}
.oc-card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 22px 50px -30px rgba(20,24,30,.28);animation:ocUp .7s .55s var(--ease) both}
.oc-card+.oc-card{margin-top:16px}
.oc-h{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.oc-h i{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-style:normal;flex:none}
.oc-h h2{margin:0;font-size:18px;letter-spacing:-.01em}.oc-h p{margin:3px 0 0;color:var(--mut);font-size:12.5px}
.oc-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--okbg);color:var(--ok)}
.oc-pill.wait{background:var(--warnbg);color:var(--warn)}
.oc-steps{display:grid;gap:0}
.oc-st{display:grid;grid-template-columns:34px 1fr;gap:14px;padding-bottom:18px;position:relative}
.oc-st:not(:last-child):before{content:"";position:absolute;left:16px;top:34px;bottom:2px;width:2px;background:#ecebe6}
.oc-st i{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:#9a9da1;font-style:normal}.oc-st i .oc-i{width:16px;height:16px}
.oc-st.done i{background:var(--ok);color:#fff}.oc-st.now i{background:var(--ink);color:#fff}
.oc-st b{display:block;font-size:14px}.oc-st span{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.5}
.oc-item{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:18px;margin-bottom:10px}
.oc-item img,.oc-item .ph{width:60px;height:72px;border-radius:12px;object-fit:cover;background:var(--soft)}
.oc-item b{font-size:13.5px;display:block}.oc-item small{color:var(--mut);font-size:12px}.oc-item strong{font-size:13.5px}
.oc-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:13.5px}.oc-row span{color:var(--mut)}
.oc-row.t{border-top:1.5px solid var(--ink);margin-top:6px;padding-top:14px}.oc-row.t strong{font-size:20px}
.oc-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.oc-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 24px;border-radius:999px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:none;border:1.5px solid var(--ink);background:#fff;color:var(--ink);transition:transform .2s var(--ease),background .2s,color .2s}
.oc-btn:hover{transform:translateY(-2px)}.oc-btn.dark{background:var(--ink);color:#fff}.oc-btn.dark:hover{background:#000}
.oc-btn .chev{transition:transform .3s var(--ease)}.oc-btn.open .chev{transform:rotate(180deg)}
/* receipt */
.rc-box{overflow:hidden;max-height:0;transition:max-height .6s var(--ease)}
.rc-box.open{max-height:1400px}
.rc{margin-top:16px;background:#fffdf8;border:1px solid #ecebe3;border-radius:6px;padding:26px 24px;font-size:13px;position:relative;box-shadow:0 14px 34px -22px rgba(0,0,0,.35)}
.rc:before,.rc:after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 6px 0,transparent 5px,#fffdf8 5.5px) 0 0/12px 8px repeat-x}
.rc:before{top:-8px;transform:scaleY(-1)}.rc:after{bottom:-8px}
.rc-top{text-align:center;padding-bottom:14px;border-bottom:1.5px dashed #d8d6cc}
.rc-top img{height:24px;width:auto}.rc-top p{margin:8px 0 0;color:var(--mut);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.rc-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;padding:14px 0;border-bottom:1.5px dashed #d8d6cc}
.rc-meta small{display:block;color:var(--mut);font-size:11px}.rc-meta b{font-size:12.5px;word-break:break-word}
.rc-lines{padding:12px 0;border-bottom:1.5px dashed #d8d6cc}
.rc-l{display:flex;justify-content:space-between;gap:12px;padding:6px 0}.rc-l span{min-width:0}.rc-l small{display:block;color:var(--mut);font-size:11.5px}
.rc-tot .oc-row{padding:5px 0;font-size:13px}.rc-tot .oc-row.t strong{font-size:18px}
.rc-ft{text-align:center;color:var(--mut);font-size:11.5px;margin-top:12px;line-height:1.6}
@keyframes ocDraw{to{stroke-dashoffset:0}}
@keyframes ocPop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes ocUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media(max-width:860px){.oc-grid{grid-template-columns:1fr}.oc-wrap{padding-top:110px}.oc-card{padding:18px;border-radius:22px}.oc-btn{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.oc-tick .circ,.oc-tick .chk{stroke-dashoffset:0}}
</style>

<body class="oc page-ready">
<main class="oc-wrap">

  </section>

  <div class="oc-grid">
    <div>
      <section class="oc-card">
        <div class="oc-h"><i><svg class="oc-i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/></svg></i><div><h2>Payment</h2><p id="pM">Your payment method</p></div><span class="oc-pill wait" id="pS" style="margin-left:auto">Pending</span></div>

        <div class="oc-steps" id="steps"></div>
      </section>
    </div>
    <div>
      <section class="oc-card">
        <div class="oc-h"><i><svg class="oc-i" viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></i><div><h2>Order summary</h2><p>Your selected pieces</p></div></div>
        <div id="items"></div>
        <div class="oc-row"><span>Subtotal</span><strong id="subtotal">Rs. 0</strong></div>

        <div class="oc-row t"><span>Total</span><strong id="total">Rs. 0</strong></div>

          <button type="button" class="oc-btn" id="rcToggle" aria-expanded="false"><svg class="oc-i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>View receipt<svg class="oc-i chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
          <button type="button" class="oc-btn dark" id="rcDl"><svg class="oc-i" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Download JPG</button>
        </div>

      <div class="oc-btns" style="margin-top:16px">
        <a class="oc-btn dark" href="dashboard.html"><svg class="oc-i" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/></svg>Track my order</a>
        <a class="oc-btn" href="collection.html"><svg class="oc-i" viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5L4 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Continue shopping</a>
      </div>
    </div>
  </div>
</main>

<script type="module">
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {app} from "./firebase-config.js";
import "./order-flow.js";
const auth=getAuth(app),Q=new URLSearchParams(location.search),id=Q.get("id"),$=x=>document.getElementById(x);
const money=v=>"Rs. "+Number(v||0).toLocaleString("en-LK");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when=o=>{const v=o.createdAt;const d=v?.toDate?v.toDate():new Date(v||Date.now());return isNaN(d)?new Date():d};
const fmt=d=>d.toLocaleString("en-LK",{day:"2-digit",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});
const CHK='<svg class="oc-i" viewBox="0 0 24 24"><path d="m6 12 4 4 8-8"/></svg>';
let order=null,lines=[];
const lineOf=it=>{const q=Math.max(1,Number(it.quantity)||1);const unit=Number(it.unitPrice??it.price??0);return{pid:it.productId||"",name:it.productName||it.name||it.title||"RIVENZ Product",meta:[it.size,it.color].filter(Boolean).join(" · "),qty:q,total:Number(it.lineTotal??unit*q),image:it.image||""}};
function mode(o){const pm=String(o.paymentMethod||""),ps=String(o.paymentStatus||"");if(/cash/i.test(pm))return"cod";if(/submitted|review/i.test(ps)||(o.paymentProof||o.paymentProofRef))return"proof";if(/paid|confirmed/i.test(ps))return"paid";return"wait"}
function paint(o){
  const m=mode(o);
  const T={cod:["Order placed","Your Cash on Delivery order has been placed. RIVENZ will confirm it shortly. Please keep the full amount ready for delivery.","Pay on delivery","Cash on Delivery: pay the full amount to the courier when your order is delivered."],
    proof:["Receipt received","Thank you. RIVENZ will check your payment receipt and confirm your order shortly.","Under review","Your payment receipt was submitted. We will confirm the payment after review."],
    paid:["Order confirmed","Thank you. Your payment is confirmed and your order is being prepared.","Paid","Payment received in full."],
    wait:["Order placed","Thank you. Your order has been received and is waiting for payment confirmation.","Pending","Complete the payment using the selected method. RIVENZ confirms your order after payment."]}[m];
  $("hT").textContent=T[0];$("hP").textContent=T[1];$("pS").textContent=T[2];$("pD").textContent=T[3];
  const good=m==="paid"||m==="cod";$("pS").className="oc-pill"+(good?"":" wait");$("tick").className="oc-tick"+(good||m==="proof"?"":" wait");
  $("pM").textContent=(o.paymentMethod||"Payment method")+" · full amount";
  const S=[["Order placed","We received your order.","done"],["Payment","Method: "+(o.paymentMethod||"-"),m==="cod"?"now":good?"done":"now"],["Confirmation","RIVENZ confirms and prepares your pieces.",m==="paid"?"now":""],["Delivery","Packed, shipped and delivered to you.",""]];
  const ic=['<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/>','<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/>','<path d="m6 12 4 4 8-8"/>','<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/>'];
  $("steps").innerHTML=S.map(([a,b,c],i)=>`<div class="oc-st ${c}"><i><svg class="oc-i" viewBox="0 0 24 24">${c==="done"?'<path d="m6 12 4 4 8-8"/>':ic[i]}</svg></i><div><b>${a}</b><span>${esc(b)}</span></div></div>`).join("");
}
function receiptHTML(o){
  const d=when(o);
  return `<div class="rc-top"><img src="logo.png" alt="RIVENZ"><p>Order receipt</p></div>
  <div class="rc-meta"><div><small>Order no.</small><b>${esc(o.id||id)}</b></div><div><small>Date</small><b>${esc(fmt(d))}</b></div><div><small>Customer</small><b>${esc(o.client||o.clientName||"-")}</b></div><div><small>Phone</small><b>${esc(o.phone||"-")}</b></div><div style="grid-column:1/-1"><small>Deliver to</small><b>${esc([o.address,o.city,o.province,o.postalCode].filter(Boolean).join(", ")||"-")}</b></div></div>
  <div class="rc-lines">${lines.map(l=>`<div class="rc-l"><span><b>${esc(l.name)}</b><small>${esc(l.meta)}${l.meta?" · ":""}Qty ${l.qty}</small></span><b>${money(l.total)}</b></div>`).join("")}</div>
  <div class="rc-tot"><div class="oc-row"><span>Subtotal</span><strong>${money(o.subtotal??o.total)}</strong></div><div class="oc-row"><span>Delivery</span><strong>${o.deliveryFee==null?"To be confirmed":money(o.deliveryFee)}</strong></div><div class="oc-row t"><span>Total</span><strong>${money(o.total)}</strong></div><div class="oc-row"><span>Payment</span><strong>${esc(o.paymentMethod||"-")}</strong></div><div class="oc-row"><span>Status</span><strong>${esc(o.paymentStatus||"Pending")}</strong></div></div>
  <div class="rc-ft">Thank you for shopping with RIVENZ.<br>This receipt confirms your order was placed.</div>`;
}
/* ---- JPG receipt drawn on a canvas (no external libraries) ---- */
async function downloadJpg(){
  const o=order;if(!o)return;
  const W=800,P=48,F="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif";
  const d=when(o),addr=[o.address,o.city,o.province,o.postalCode].filter(Boolean).join(", ")||"-";
  const c=document.createElement("canvas"),x=c.getContext("2d");
  const wrap=(t,w,font)=>{x.font=font;const words=String(t).split(/\s+/),out=[];let cur="";words.forEach(wd=>{const n=cur?cur+" "+wd:wd;if(x.measureText(n).width>w&&cur){out.push(cur);cur=wd}else cur=n});if(cur)out.push(cur);return out.length?out:[""]};
  const addrL=wrap(addr,W-P*2-120,"600 20px "+F);
  const rows=lines.map(l=>({n:wrap(l.name,W-P*2-170,"700 22px "+F),m:l.meta+(l.meta?" · ":"")+"Qty "+l.qty,t:money(l.total)}));
  let H=P+90+40+ (4*34+ (addrL.length-1)*26) +30;
  rows.forEach(r=>{H+=r.n.length*28+30+14});
  H+=30+5*40+90+P;
  c.width=W;c.height=H;
  x.fillStyle="#fffdf8";x.fillRect(0,0,W,H);
  const line=y=>{x.save();x.strokeStyle="#cfcdc2";x.lineWidth=2;x.setLineDash([8,6]);x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();x.restore()};
  let y=P;
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src="logo.png"});const h=44,w=img.width/img.height*h;x.drawImage(img,(W-w)/2,y,w,h);y+=h}catch(e){x.fillStyle="#111316";x.font="800 34px "+F;x.textAlign="center";x.fillText("RIVENZ",W/2,y+34);y+=40}
  x.textAlign="center";x.fillStyle="#7c8087";x.font="600 15px "+F;x.fillText("ORDER RECEIPT",W/2,y+34);y+=60;line(y);y+=36;
  x.textAlign="left";
  const kv=(k,v,yy)=>{x.fillStyle="#7c8087";x.font="500 18px "+F;x.fillText(k,P,yy);x.fillStyle="#111316";x.font="600 20px "+F;x.fillText(v,P+170,yy)};
  kv("Order no.",String(o.id||id),y);y+=34;kv("Date",fmt(d),y);y+=34;kv("Customer",String(o.client||o.clientName||"-"),y);y+=34;kv("Phone",String(o.phone||"-"),y);y+=34;
  x.fillStyle="#7c8087";x.font="500 18px "+F;x.fillText("Deliver to",P,y);x.fillStyle="#111316";x.font="600 20px "+F;addrL.forEach((t,i)=>x.fillText(t,P+170,y+i*26));y+=(addrL.length-1)*26+26;
  line(y);y+=40;
  rows.forEach(r=>{x.fillStyle="#111316";x.font="700 22px "+F;r.n.forEach((t,i)=>x.fillText(t,P,y+i*28));x.textAlign="right";x.fillText(r.t,W-P,y);x.textAlign="left";y+=r.n.length*28;x.fillStyle="#7c8087";x.font="500 17px "+F;x.fillText(r.m,P,y);y+=44});
  line(y);y+=40;
  const tr=(k,v,big)=>{x.fillStyle=big?"#111316":"#7c8087";x.font=(big?"800 26px ":"500 19px ")+F;x.fillText(k,P,y);x.fillStyle="#111316";x.textAlign="right";x.font=(big?"800 28px ":"700 19px ")+F;x.fillText(v,W-P,y);x.textAlign="left";y+=big?46:38};
  tr("Subtotal",money(o.subtotal??o.total));tr("Delivery",o.deliveryFee==null?"To be confirmed":money(o.deliveryFee));tr("Total",money(o.total),true);tr("Payment",String(o.paymentMethod||"-"));tr("Status",String(o.paymentStatus||"Pending"));
  y+=14;x.textAlign="center";x.fillStyle="#7c8087";x.font="500 16px "+F;x.fillText("Thank you for shopping with RIVENZ.",W/2,y);
  c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="RIVENZ-receipt-"+String(o.id||id).replace(/[^\w-]/g,"")+".jpg";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)},"image/jpeg",.95);
}
async function load(){
  if(!id){$("id").textContent="Not found";return}
  $("id").textContent=id;
  order=await window.graphicsOrderFlow.get(id);
  if(!order){$("hT").textContent="Order not found";$("hP").textContent="We could not find this order.";return}
  lines=(order.items||order.products||[]).map(lineOf);
  $("subtotal").textContent=money(order.subtotal??order.total);$("total").textContent=money(order.total);
  $("delivery").textContent=order.deliveryFee==null?"To be confirmed":(Number(order.deliveryFee)?money(order.deliveryFee):"Free");
  $("items").innerHTML=lines.map(l=>`<div class="oc-item" data-pid="${esc(l.pid)}">${l.image?`<img src="${esc(l.image)}" alt="">`:'<div class="ph"></div>'}<div><b>${esc(l.name)}</b><small>${esc(l.meta)}${l.meta?" · ":""}Qty ${l.qty}</small></div><strong>${money(l.total)}</strong></div>`).join("");
  paint(order);$("rc").innerHTML=receiptHTML(order);
}
$("rcToggle").addEventListener("click",e=>{const b=e.currentTarget,box=$("rcBox"),o=!box.classList.contains("open");box.classList.toggle("open",o);b.classList.toggle("open",o);b.setAttribute("aria-expanded",String(o))});
