<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Refund | RIVENZ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="user-nav.css?v=46">
<script src="public-content.js?v=27"></script>
<style>
body{background:#000;font-family:Inter,system-ui,sans-serif;position:relative;overflow-x:hidden}body:before,body:after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(80px);pointer-events:none}body:before{width:320px;height:320px;left:-90px;top:140px;background:#3b4a8f;opacity:.3}body:after{width:340px;height:340px;right:-100px;top:420px;background:#6b4a3a;opacity:.25}.home-header,.rf-wrap,.rvz-ft{position:relative;z-index:1}
.rf-wrap{max-width:860px;margin:0 auto;padding:40px 18px 80px}
.rf-wrap h1{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.03em;margin:0 0 6px;color:#fff}.rf-wrap>p{color:#a5a7ae;margin:0 0 24px;font-size:14px}
.rf-card{background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px;margin-bottom:14px}
.rf-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rf-h b{font-size:15px}.rf-h small{display:block;color:#9a9ca4;margin-top:3px;font-size:12px}
.rf-amt{font-size:20px;font-weight:800}
.rf-s{display:flex;gap:6px;margin:16px 0 10px}.rf-s span{flex:1;font-size:11.5px;padding-top:8px;border-top:3px solid #34343a;color:#80828a}.rf-s span.c0.on{border-color:#e5484d;color:#fff}.rf-s span.c1.on{border-color:#f5a524;color:#fff}.rf-s span.c2.on{border-color:#30a46c;color:#fff}.rf-lk{display:inline-flex;align-items:center;gap:7px;margin-top:12px;color:#7d7f87;border:1px solid #2a2a2e;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;cursor:not-allowed}.rf-lk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rf-n{font-size:13px;color:#c9cbd1;line-height:1.55}
.rf-a{display:inline-block;margin-top:12px;color:#fff;border:1px solid #3a3a40;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;text-decoration:none}
.rf-vr{margin-top:12px;background:none;border:0;padding:0;color:#c9cbd1;font:600 12.5px Inter,system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}.rf-vr:hover{color:#fff}.rf-e{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#9a9ca4;border-radius:20px;padding:34px;text-align:center;font-size:14px}
</style>
</head>
<body>
<header class="home-header"><div class="home-nav-wrap"><a class="home-brand" href="index.html" aria-label="RIVENZ home"><img src="logo.png" alt="RIVENZ"></a><nav class="home-nav nav"><a href="index.html">Home</a><a href="dashboard.html">My Orders</a></nav></div></header>
<main class="rf-wrap">
<h1>My Refund</h1><p>Track the refunds for your cancelled orders.</p>
<div id="list"><div class="rf-e">Loading...</div></div>
</main>
<script type="module">
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {collection,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
import {app,db} from "./firebase-config.js";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=v=>"Rs. "+Number(v||0).toLocaleString("en-LK");
const L=["Refund requested","Refund processing","Refund completed"];
function dt(v){if(!v)return"";const d=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(d)?"":d.toLocaleDateString("en-LK",{day:"2-digit",month:"short",year:"numeric"})}
let ROWS=[];
function draw(rows){ROWS=rows;
 rows.sort((a,b)=>String(b.refund.requestedAt||"").localeCompare(String(a.refund.requestedAt||"")));
 $("list").innerHTML=rows.length?rows.map(o=>{const r=o.refund,st=String(r.status||"Refund Pending"),k=/complet/i.test(st)?2:/process/i.test(st)?1:0;
 return '<div class="rf-card"><div class="rf-h"><div><b>Order #'+esc(o.id)+'</b><small>Requested '+esc(dt(r.requestedAt))+(r.bank&&r.bank.bank?' &middot; '+esc(r.bank.bank):'')+'</small></div><div class="rf-amt">'+(r.amount!=null&&k>0?money(r.amount):"Waiting")+'</div></div><div class="rf-s">'+L.map((x,i)=>'<span class="c'+i+' '+(i<=k?'on':'')+'">'+x+'</span>').join('')+'</div><div class="rf-n">'+(k===2?'Your refund has been completed'+(r.completedAt?' on '+esc(dt(r.completedAt)):'')+'. Please check your email for the refund receipt.':k===1?'Your refund is being processed.':'We received your refund request. The refund amount will be confirmed after RIVENZ reviews your order and payment.')+'</div>'+(k===2?'<button type="button" class="rf-vr" data-rc="'+esc(o.id)+'">View refund receipt</button>':'<a class="rf-a" href="order-details.html?id='+encodeURIComponent(o.id)+'">View order</a>')+'</div>'}).join(""):'<div class="rf-e">You have no refunds.</div>';
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-rc]");if(!b)return;const o=ROWS.find(x=>x.id===b.dataset.rc);if(o&&window.rvzRefundReceipt)window.rvzRefundReceipt(o)});
onAuthStateChanged(getAuth(app),u=>{
 if(!u){location.href="auth.html?next="+encodeURIComponent("refund.html");return}
 onSnapshot(query(collection(db,"orders"),where("uid","==",u.uid)),s=>draw(s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>o.refund&&o.refund.status)),()=>{$("list").innerHTML='<div class="rf-e">Could not load refunds. Please refresh.</div>'});
});
</script>
<script src="refund-receipt.js?v=1"></script>
<script type="module" src="account-guard.js?v=26"></script>
<script type="module" src="user-nav.js?v=46"></script>
</body>
</html>
