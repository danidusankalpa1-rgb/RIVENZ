<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | RIVENZ</title>
<link rel="stylesheet" href="style.css">
<script src="ui-messages.js?v=23"></script>
<style>
:root{--profile-line:rgba(15,18,22,.09);--profile-soft:#777d86;--profile-ink:#111318;--profile-accent:#111318}
.profile-page{max-width:1120px;margin:34px auto 90px;padding:0 18px}
.profile-hero{position:relative;overflow:hidden;border:1px solid var(--profile-line);border-radius:26px;background:linear-gradient(135deg,#f7f7f5,#fff 60%,#f0f0ee);padding:30px;margin-bottom:16px}
.profile-hero:after{content:"";position:absolute;width:260px;height:260px;right:-100px;top:-140px;border-radius:50%;background:rgba(0,0,0,.045);filter:blur(8px)}
.profile-hero-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:end;gap:24px}
.profile-kicker{font-size:9px;letter-spacing:.2em;color:#858a91;font-weight:800}.profile-hero h1{font-size:clamp(34px,6vw,58px);letter-spacing:-.055em;margin:8px 0}.profile-hero p{margin:0;color:var(--profile-soft);font-size:12px;line-height:1.7;max-width:650px}
.account-chip{border:1px solid var(--profile-line);background:rgba(255,255,255,.72);border-radius:16px;padding:14px 16px;min-width:205px}.account-chip small{display:block;color:#858a91;font-size:8px;letter-spacing:.1em}.account-chip strong{display:block;margin-top:7px;font-size:12px;word-break:break-word}
.profile-layout{display:grid;grid-template-columns:1.45fr .85fr;gap:16px}.profile-card{background:#fff;border:1px solid var(--profile-line);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(15,18,22,.035)}.profile-card h2{font-size:15px;margin:0 0 16px}.profile-card-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:16px}.profile-card-head h2{margin:0}.live-pill{font-size:8px;color:#555d67;border:1px solid var(--profile-line);padding:6px 8px;border-radius:999px}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.profile-field.full{grid-column:1/-1}.profile-field label{display:block;color:#777d86;font-size:9px;letter-spacing:.08em;margin-bottom:7px}.profile-field input{width:100%;box-sizing:border-box;background:#fafafa;border:1px solid var(--profile-line);color:#111318;border-radius:11px;padding:12px 13px;font:inherit;font-size:12px;outline:none}.profile-field input:focus{border-color:rgba(17,19,24,.3);box-shadow:0 0 0 3px rgba(17,19,24,.045)}.readonly{opacity:.62}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.actions button,.actions a{border:1px solid var(--profile-line);background:#fff;color:#111318;border-radius:10px;padding:10px 13px;font-size:10px;text-decoration:none;cursor:pointer}.actions .primary{background:#111318;color:#fff;border-color:#111318;font-weight:800}.status-line{font-size:10px;color:#818793;margin-top:10px}.status-line.ok{color:#477b59}.status-line.err{color:#b24d4d}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px;border:1px solid var(--profile-line);border-radius:14px;background:#fafafa}.stat small{display:block;color:#777d86;font-size:8px}.stat strong{display:block;font-size:19px;margin-top:6px}.stat span{display:block;color:#858b95;font-size:9px;margin-top:4px}.order-list{display:grid;gap:9px}.order-card{display:block;color:inherit;text-decoration:none;border:1px solid var(--profile-line);border-radius:14px;padding:13px;background:#fafafa}.order-card:hover{border-color:rgba(17,19,24,.24)}.order-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.order-id{font-size:9px;color:#555d67;letter-spacing:.08em}.order-service{font-size:12px;font-weight:750;margin-top:5px}.order-meta{display:flex;gap:13px;flex-wrap:wrap;margin-top:9px;color:#777d86;font-size:9px}.badge{font-size:8px;padding:6px 8px;border-radius:999px;background:#111318;color:#fff;white-space:nowrap}.delivery{margin-top:9px;padding-top:9px;border-top:1px solid var(--profile-line);font-size:9px;color:#777d86}.pay-list{display:grid;gap:0}.pay-row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-top:1px solid var(--profile-line);font-size:10px;color:#858b95}.pay-row:first-child{border-top:0}.pay-row strong{color:#111318;text-align:right}.notice{padding:13px;border:1px dashed var(--profile-line);border-radius:13px;color:#777d86;font-size:10px;line-height:1.6}.activity{display:grid;gap:9px}.activity-item{padding:11px 12px;border:1px solid var(--profile-line);border-radius:12px;background:#fafafa}.activity-item strong{display:block;font-size:10px}.activity-item small{display:block;color:#6f757f;font-size:8px;margin-top:5px}.profile-footer-actions{display:flex;gap:9px;flex-wrap:wrap}.profile-footer-actions a{font-size:10px;color:#555d67;text-decoration:none;padding:9px 0}
@media(max-width:850px){.profile-layout{grid-template-columns:1fr}.profile-hero-inner{display:block}.account-chip{margin-top:18px}.profile-grid{grid-template-columns:1fr}.profile-field.full{grid-column:auto}.profile-page{margin-top:24px}}

/* RIVENZ clothing light-header correction — profile page only */
body{background:#fbfbfa;color:#15171b}
.site-header{background:rgba(255,255,255,.92);border-bottom:1px solid #e9eaed;box-shadow:0 8px 24px rgba(20,24,30,.04)}
.brand img{filter:none}
.nav{color:#666b73}
.nav a{color:#666b73}
.nav a:hover{color:#15171b}
.nav a.active{background:#15171b;color:#fff;border-radius:999px;padding:9px 14px}
.menu-toggle{color:#15171b}
@media(max-width:800px){.nav{top:78px;background:#fff;border-bottom:1px solid #e9eaed;color:#666b73}.nav a{color:#666b73}.nav a.active{color:#fff;background:#15171b}}

</style>
<style>
body{background:#f6f7f9!important;color:#111827;font-family:Inter,system-ui,sans-serif}
.pf{max-width:760px;margin:0 auto;padding:40px 20px 80px}
.pf-top{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.pf-av{width:72px;height:72px;border-radius:50%;background:#4f46e5;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700;flex:0 0 auto}
.pf-top h1{font-size:22px;margin:0 0 4px;font-weight:700;letter-spacing:-.02em}.pf-top p{margin:0;font-size:13px;color:#6b7280;word-break:break-all}
.pf-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px;margin-bottom:16px}
.pf-card h2{font-size:15px;font-weight:700;margin:0 0 18px}
.pf-g{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pf-f.full{grid-column:1/-1}
.pf-f label{display:block;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:7px}
.pf-f input,.pf-f select,.pf-f textarea{width:100%;height:46px;border:1px solid #d9dbe1;border-radius:10px;padding:0 14px;font:500 14px Inter,sans-serif;color:#111827;background:#fff;outline:0;box-sizing:border-box}.pf-f textarea{height:76px;padding:12px 14px;resize:vertical}
.pf-f input:focus,.pf-f select:focus,.pf-f textarea:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}.pf-f input[readonly]{background:#f3f4f6;color:#6b7280}
.pf-act{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.pf-btn{height:44px;padding:0 22px;border-radius:10px;border:1px solid #d9dbe1;background:#fff;color:#111827;font:600 14px Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.pf-btn.pri{background:#4f46e5;border-color:#4f46e5;color:#fff}.pf-btn.pri:hover{background:#4338ca}.pf-btn:disabled{opacity:.6}
.pf-btn.dng{color:#b42318}
.pf-st{font-size:13px;color:#6b7280}.pf-st.ok{color:#1f7a4d}.pf-st.err{color:#b42318}
.pf-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #f0f1f3;font-size:14px}.pf-row:first-of-type{border-top:0}.pf-row span{color:#6b7280;font-size:13px}.pf-row small{display:block;color:#9ca3af;font-size:12px;margin-top:3px}
@media(max-width:560px){.pf-g{grid-template-columns:1fr}.pf-card{padding:18px}}
</style>
<link rel="stylesheet" href="user-nav.css?v=23">

</head>
<body class="page-ready">
<header class="site-header">
<a class="brand" href="index.html"><img src="logo.png" alt="RIVENZ logo"></a>
<button class="menu-toggle" id="toggle" type="button">☰</button>
<nav class="nav" id="nav">
<a href="index.html">Home</a><a href="collection.html">Collections</a><a href="weddings.html">Offers</a><a href="dashboard.html">My Orders</a><a href="profile.html" class="active">My Profile</a><a href="auth.html" id="logout">Logout</a>
</nav>
</header>
<main class="pf">
  <div class="pf-top"><div class="pf-av" id="pfAv">C</div><div><h1 id="heroName">My Profile</h1><p id="heroEmail">Loading...</p></div></div>
  <section class="pf-card"><h2>Personal details</h2>
    <div class="pf-g">
      <div class="pf-f"><label for="name">Full name</label><input id="name" autocomplete="name"></div>
      <div class="pf-f"><label for="phone">Phone number</label><input id="phone" autocomplete="tel" inputmode="tel"></div>
      <div class="pf-f full"><label for="email">Email (login)</label><input id="email" readonly></div>
      <div class="pf-f full"><label for="address">Delivery address</label><textarea id="address" autocomplete="street-address"></textarea></div>
      <div class="pf-f"><label for="city">City</label><input id="city" autocomplete="address-level2"></div>
      <div class="pf-f"><label for="province">Province</label><input id="province" autocomplete="address-level1"></div>
      <div class="pf-f"><label for="postalCode">Postal code</label><input id="postalCode" autocomplete="postal-code" inputmode="numeric"></div>
    </div>
    <div class="pf-act"><button class="pf-btn pri" id="save" type="button">Save changes</button><span id="status" class="pf-st">Loading your profile...</span></div>
  </section>
  <section class="pf-card"><h2>Account</h2>
    <div class="pf-row"><div>Password<small>We will email you a link to set a new password.</small></div><button class="pf-btn" id="pwReset" type="button">Reset password</button></div>
    <div class="pf-row"><div>My orders<small>Track and review your orders.</small></div><a class="pf-btn" href="dashboard.html">View orders</a></div>
    <div class="pf-row"><div>Sign out<small>Log out of this device.</small></div><a class="pf-btn dng" href="auth.html" id="logout">Logout</a></div>
  </section>
</main>

<script type="module">
import {getAuth,onAuthStateChanged,signOut,updateProfile,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {doc,onSnapshot,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
import {app,db} from "./firebase-config.js";
const auth=getAuth(app), $=id=>document.getElementById(id); let user=null,stopClient=null,saving=false,dirty=false;
const F=["name","phone","address","city","province","postalCode"];
const statusEl=$("status"),saveBtn=$("save");
function setStatus(t,c=""){statusEl.textContent=t;statusEl.className="pf-st "+c;}
F.forEach(id=>$(id).addEventListener("input",()=>{dirty=true}));
function renderProfile(data){
  const name=data?.name||user?.displayName||"",email=data?.email||user?.email||"";
  if(!dirty){F.forEach(id=>{$(id).value=id==="name"?name:(data?.[id]||"")})}
  $("email").value=email;$("heroName").textContent=name||"My Profile";$("heroEmail").textContent=email||"—";$("pfAv").textContent=(name||email||"C").trim().charAt(0).toUpperCase();
  if(!saving)setStatus("","");
}
saveBtn.addEventListener("click",async()=>{if(!user||saving)return;const v={};F.forEach(id=>v[id]=$(id).value.trim());if(!v.name){setStatus("Please enter your name.","err");return}saving=true;saveBtn.disabled=true;setStatus("Saving...");try{await setDoc(doc(db,"clients",user.uid),{uid:user.uid,...v,email:user.email||"",updatedAt:serverTimestamp()},{merge:true});await updateProfile(user,{displayName:v.name});dirty=false;setStatus("Profile saved successfully.","ok");}catch(e){console.error(e);setStatus("Could not save profile. Please try again.","err")}finally{saving=false;saveBtn.disabled=false;}});
$("pwReset").addEventListener("click",async()=>{if(!user?.email)return;const b=$("pwReset");b.disabled=true;try{await sendPasswordResetEmail(auth,user.email);setStatus("Password reset email sent to "+user.email+".","ok")}catch(e){console.error(e);setStatus("Could not send the reset email. Please try again later.","err")}finally{b.disabled=false}});
$("logout").addEventListener("click",async e=>{e.preventDefault();try{await signOut(auth)}finally{location.href="auth.html"}});
onAuthStateChanged(auth,u=>{if(stopClient)stopClient();if(!u){location.replace("auth.html?next=profile.html");return}user=u;stopClient=onSnapshot(doc(db,"clients",u.uid),snap=>renderProfile(snap.exists()?snap.data():{name:u.displayName||"",email:u.email||""}),err=>{console.error(err);setStatus("Profile could not be loaded. Check Firebase access.","err")});});
</script>
<script type="module" src="account-guard.js?v=23"></script>

</body>
