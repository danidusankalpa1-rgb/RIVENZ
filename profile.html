<style>
:root{--profile-line:rgba(15,18,22,.09);--profile-soft:#777d86;--profile-ink:#111318;--profile-accent:#111318}
.profile-page{max-width:1120px;margin:34px auto 90px;padding:0 18px}
.profile-hero{position:relative;overflow:hidden;border:1px solid var(--profile-line);border-radius:26px;background:linear-gradient(135deg,#f7f7f5,#fff 60%,#f0f0ee);padding:30px;margin-bottom:16px}
.profile-hero:after{content:"";position:absolute;width:260px;height:260px;right:-100px;top:-140px;border-radius:50%;background:rgba(0,0,0,.045);filter:blur(8px)}
.profile-hero-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:end;gap:24px}
.profile-kicker{font-size:9px;letter-spacing:.2em;color:#858a91;font-weight:800}.profile-hero h1{font-size:clamp(34px,6vw,58px);letter-spacing:-.055em;margin:8px 0}.profile-hero p{margin:0;color:var(--profile-soft);font-size:12px;line-height:1.7;max-width:650px}
.account-chip{border:1px solid var(--profile-line);background:rgba(255,255,255,.72);border-radius:16px;padding:14px 16px;min-width:205px}.account-chip small{display:block;color:#858a91;font-size:8px;letter-spacing:.1em}.account-chip strong{display:block;margin-top:7px;font-size:12px;word-break:break-word}
.profile-layout{display:grid;grid-template-columns:1.45fr .85fr;gap:16px}.profile-card{background:#fff;border:1px solid var(--profile-line);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(15,18,22,.035)}.profile-card h2{font-size:15px;margin:0 0 16px}.profile-card-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:16px}.profile-card-head h2{margin:0}.live-pill{font-size:8px;color:#555d67;border:1px solid var(--profile-line);padding:6px 8px;border-radius:999px}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.profile-field.full{grid-column:1/-1}.profile-field label{display:block;color:#777d86;font-size:9px;letter-spacing:.08em;margin-bottom:7px}.profile-field input{width:100%;box-sizing:border-box;background:#fafafa;border:1px solid var(--profile-line);color:#111318;border-radius:11px;padding:12px 13px;font:inherit;font-size:12px;outline:none}.profile-field input:focus{border-color:rgba(17,19,24,.3);box-shadow:0 0 0 3px rgba(17,19,24,.045)}.readonly{opacity:.62}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.actions button,.actions a{border:1px solid var(--profile-line);background:#fff;color:#111318;border-radius:10px;padding:10px 13px;font-size:10px;text-decoration:none;cursor:pointer}.actions .primary{background:#111318;color:#fff;border-color:#111318;font-weight:800}.status-line{font-size:10px;color:#818793;margin-top:10px}.status-line.ok{color:#477b59}.status-line.err{color:#b24d4d}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px;border:1px solid var(--profile-line);border-radius:14px;background:#fafafa}.stat small{display:block;color:#777d86;font-size:8px}.stat strong{display:block;font-size:19px;margin-top:6px}.stat span{display:block;color:#858b95;font-size:9px;margin-top:4px}.order-list{display:grid;gap:9px}.order-card{display:block;color:inherit;text-decoration:none;border:1px solid var(--profile-line);border-radius:14px;padding:13px;background:#fafafa}.order-card:hover{border-color:rgba(17,19,24,.24)}.order-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.order-id{font-size:9px;color:#555d67;letter-spacing:.08em}.order-service{font-size:12px;font-weight:750;margin-top:5px}.order-meta{display:flex;gap:13px;flex-wrap:wrap;margin-top:9px;color:#777d86;font-size:9px}.badge{font-size:8px;padding:6px 8px;border-radius:999px;background:#111318;color:#fff;white-space:nowrap}.delivery{margin-top:9px;padding-top:9px;border-top:1px solid var(--profile-line);font-size:9px;color:#777d86}.pay-list{display:grid;gap:0}.pay-row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-top:1px solid var(--profile-line);font-size:10px;color:#858b95}.pay-row:first-child{border-top:0}.pay-row strong{color:#111318;text-align:right}.notice{padding:13px;border:1px dashed var(--profile-line);border-radius:13px;color:#777d86;font-size:10px;line-height:1.6}.activity{display:grid;gap:9px}.activity-item{padding:11px 12px;border:1px solid var(--profile-line);border-radius:12px;background:#fafafa}.activity-item strong{display:block;font-size:10px}.activity-item small{display:block;color:#6f757f;font-size:8px;margin-top:5px}.profile-footer-actions{display:flex;gap:9px;flex-wrap:wrap}.profile-footer-actions a{font-size:10px;color:#555d67;text-decoration:none;padding:9px 0}
@media(max-width:850px){.profile-layout{grid-template-columns:1fr}.profile-hero-inner{display:block}.account-chip{margin-top:18px}.profile-grid{grid-template-columns:1fr}.profile-field.full{grid-column:auto}.profile-page{margin-top:24px}}

<style>
body{background:#0f0f11!important;color:#f4f4f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.pf{max-width:620px;margin:0 auto;padding:34px 20px 60px;min-height:70vh}
.pf-tabs{display:flex;gap:22px;align-items:baseline;margin:0 0 34px}.pf-tabs a{font:600 clamp(24px,5vw,30px) Unbounded,Inter,sans-serif;text-transform:uppercase;letter-spacing:-.02em;color:#6f6f77;text-decoration:none}.pf-tabs a.on{color:#fff}

.pf-ad{display:flex;gap:16px;align-items:center;padding:16px 0}.pf-ic{width:50px;height:50px;border-radius:12px;background:#26262b;display:grid;place-items:center;flex:0 0 auto;color:#e5e5e8}.pf-ad div{min-width:0}.pf-ad .n{color:#9a9aa2;font-size:15px}.pf-ad .t{font-size:14.5px;line-height:1.5;color:#f4f4f5}

.pf-bd{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}.pf-bd.show{opacity:1;visibility:visible}
.pf-sh{width:min(560px,100%);max-height:92dvh;overflow:auto;background:#17171a;border-radius:24px 24px 0 0;padding:26px 20px 22px;transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1)}.pf-bd.show .pf-sh{transform:none}
@media(min-width:700px){.pf-bd{align-items:center}.pf-sh{border-radius:24px}}
.pf-sh h3{font-size:22px;margin:0 0 20px;display:flex;justify-content:space-between;align-items:center}.pf-x{width:40px;height:40px;border:0;background:transparent;color:#fff;font-size:26px;cursor:pointer;line-height:1}

.pf-f input{width:100%;height:58px;border:1px solid #34343a;border-radius:14px;padding:22px 16px 6px;background:#1b1b1f;color:#fff;font:500 15.5px Inter,sans-serif;outline:0;box-sizing:border-box}.pf-f input:focus{border-color:#8b8b95;box-shadow:0 0 0 3px rgba(255,255,255,.08)}.pf-f input[readonly]{color:#8a8a92}
.pf-f label{position:absolute;left:16px;top:9px;font-size:12px;color:#9a9aa2;pointer-events:none}
.pf-sa{display:flex;justify-content:flex-end;align-items:center;gap:18px;margin-top:20px}.pf-sa a,.pf-sa .lk{color:#fff;font:600 15px Inter,sans-serif;background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}.pf-sa .dl{color:#f87171;margin-right:auto}
.pf-sv{height:52px;padding:0 28px;border-radius:14px;border:0;background:#fff;color:#111;font:700 15px Inter,sans-serif;cursor:pointer}.pf-sv:disabled{opacity:.5}
.pf-st{font-size:13px;color:#9a9aa2;margin-top:12px;min-height:18px;text-align:right}.pf-st.ok{color:#4ade80}.pf-st.err{color:#f87171}
@media(max-width:520px){.pf-g{grid-template-columns:1fr}}
</style>

<style>.pf-r{padding:11px 0!important;font-size:14px!important}.pf-card{padding:2px 16px!important;border-radius:14px!important}.pf-ad{padding:12px 0!important}.pf-ic{width:42px!important;height:42px!important;border-radius:10px!important}.pf-eb{height:36px!important;padding:0 16px!important;font-size:13px!important;border-radius:10px!important}.pf-out{height:46px!important;font-size:14px!important}
.pf-f input,.pf-f select{height:48px!important;padding:19px 14px 4px!important;font-size:14.5px!important;border-radius:12px!important}.pf-f label{top:7px!important;left:14px!important;font-size:11px!important}
.pf-f select{width:100%;border:1px solid #34343a;background:#1b1b1f;color:#fff;font-family:Inter,sans-serif;font-weight:500;outline:0;box-sizing:border-box;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239a9aa2' stroke-width='2' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:18px}.pf-f select:focus{border-color:#8b8b95}
.pf-f select option{background:#1b1b1f;color:#fff}.pf-sh{padding:22px 18px 18px!important}.pf-sh h3{font-size:19px!important;margin-bottom:16px!important}.pf-g{gap:10px!important}.pf-sv{height:46px!important;font-size:14px!important;border-radius:12px!important}</style>

<body class="page-ready">
<header class="site-header">
<a class="brand" href="index.html"><img src="logo.png" alt="RIVENZ logo"></a>
<button class="menu-toggle" id="toggle" type="button">☰</button>
<nav class="nav" id="nav">
<a href="index.html">Home</a><a href="collection.html">Collections</a><a href="weddings.html">Offers</a><a href="dashboard.html">My Orders</a><a href="profile.html" class="active">My Profile</a><a href="auth.html" id="logout">Logout</a>
</nav>
</header>
<main class="pf">
  <div class="pf-tabs"><a href="dashboard.html">Orders</a><a class="on" href="profile.html">Profile</a></div>
  <div class="pf-sec"><h2>Contact</h2><button class="pf-eb" id="editBtn" type="button">Edit</button></div>
  <div class="pf-card">
    <div class="pf-r"><span>Name</span><b id="vName">—</b></div>
    <div class="pf-r"><span>Phone</span><b id="vPhone">—</b></div>
    <div class="pf-r"><span>Email</span><b id="vEmail">—</b></div>
  </div>
  <div class="pf-sec"><h2>Delivery address</h2><button class="pf-eb" id="addrBtn" type="button">Add</button></div>
  <div class="pf-card"><div class="pf-ad"><div class="pf-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></div><div id="vAddr"><span class="n">No address added</span></div></div></div>
  <button class="pf-out" id="logout" type="button">Sign out</button>
</main>

<div class="pf-bd" id="bdEdit"><div class="pf-sh" role="dialog" aria-modal="true"><h3>Edit profile <button class="pf-x" type="button" data-close aria-label="Close">&times;</button></h3>
  <div class="pf-g"><div class="pf-f"><input id="fFirst" autocomplete="given-name" placeholder=" "><label for="fFirst">First name</label></div><div class="pf-f"><input id="fLast" autocomplete="family-name" placeholder=" "><label for="fLast">Last name</label></div>
  <div class="pf-f full"><input id="fPhone" autocomplete="tel" inputmode="tel" placeholder=" "><label for="fPhone">Phone number</label></div>
  <div class="pf-f full"><input id="fEmail" readonly placeholder=" "><label for="fEmail">Email</label></div></div>
  <div class="pf-st" id="stEdit"></div><div class="pf-sa"><button class="lk" type="button" data-close>Cancel</button><button class="pf-sv" id="saveEdit" type="button">Save</button></div></div></div>

<div class="pf-bd" id="bdAddr"><div class="pf-sh" role="dialog" aria-modal="true"><h3>Delivery address <button class="pf-x" type="button" data-close aria-label="Close">&times;</button></h3>
  <div class="pf-g"><div class="pf-f full"><input id="fAddress" autocomplete="street-address" placeholder=" "><label for="fAddress">Address</label></div>
  <div class="pf-f"><input id="fCity" autocomplete="address-level2" placeholder=" "><label for="fCity">City</label></div><div class="pf-f"><select id="fProvince"><option value="">Select province</option><option>Western</option><option>Central</option><option>Southern</option><option>Northern</option><option>Eastern</option><option>North Western</option><option>North Central</option><option>Uva</option><option>Sabaragamuwa</option></select><label for="fProvince" class="sl">Province</label></div>
  <div class="pf-f full"><input id="fPostal" autocomplete="postal-code" inputmode="numeric" placeholder=" "><label for="fPostal">Postal code (optional)</label></div></div>
  <div class="pf-st" id="stAddr"></div><div class="pf-sa"><button class="lk dl" id="delAddr" type="button" style="display:none">Remove</button><button class="lk" type="button" data-close>Cancel</button><button class="pf-sv" id="saveAddr" type="button">Save</button></div></div></div>

<script type="module">
import {getAuth,onAuthStateChanged,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {doc,onSnapshot,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
import {app,db} from "./firebase-config.js";
const auth=getAuth(app),$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let user=null,stop=null,data={};
const open=id=>{$(id).classList.add("show");document.body.style.overflow="hidden"},close=()=>{document.querySelectorAll(".pf-bd").forEach(b=>b.classList.remove("show"));document.body.style.overflow=""};
document.querySelectorAll(".pf-bd").forEach(b=>b.addEventListener("click",e=>{if(e.target===b||e.target.closest("[data-close]"))close()}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
function render(){
  const name=data.name||user?.displayName||"",email=data.email||user?.email||"";
  $("vName").textContent=name||"—";$("vPhone").textContent=data.phone||"—";$("vEmail").textContent=email||"—";
  const parts=[data.address,[data.city,data.province].filter(Boolean).join(", "),data.postalCode].filter(Boolean);
  $("vAddr").innerHTML=parts.length?'<div class="t">'+parts.map(esc).join("<br>")+'</div>':'<span class="n">No address added</span>';
  $("addrBtn").textContent=parts.length?"Edit":"Add";
}
$("editBtn").addEventListener("click",()=>{const n=(data.name||user?.displayName||"").trim(),i=n.indexOf(" ");$("fFirst").value=i<0?n:n.slice(0,i);$("fLast").value=i<0?"":n.slice(i+1);$("fPhone").value=data.phone||"";$("fEmail").value=data.email||user?.email||"";$("stEdit").textContent="";open("bdEdit")});
$("addrBtn").addEventListener("click",()=>{$("fAddress").value=data.address||"";$("fCity").value=data.city||"";{const sel=$("fProvince"),v=(data.province||"").replace(/\s*Province$/i,"").trim();sel.value=v;if(sel.value!==v&&v){sel.add(new Option(v,v));sel.value=v}}$("fPostal").value=data.postalCode||"";$("delAddr").style.display=(data.address||data.city)?"":"none";$("stAddr").textContent="";open("bdAddr")});
async function put(patch,btn,st){if(!user)return;btn.disabled=true;st.className="pf-st";st.textContent="Saving...";try{await setDoc(doc(db,"clients",user.uid),{uid:user.uid,...patch,email:user.email||"",updatedAt:serverTimestamp()},{merge:true});Object.assign(data,patch);render();close()}catch(e){console.error(e);st.className="pf-st err";st.textContent="Could not save. Please try again."}finally{btn.disabled=false}}
const RV={name(v){v=String(v||'').trim().replace(/\s+/g,' ');if(v.length<2||v.length>60||!/^[\p{L}\p{M}][\p{L}\p{M}\s.'\-]*$/u.test(v)||(v.match(/\p{L}/gu)||[]).length<2||/(.)\1{3,}/u.test(v))return'Please enter your real name (letters only).';return''},
phone(v,opt){v=String(v||'').trim();if(!v)return opt?'':'Please enter your phone number.';var d=v.replace(/[\s\-()]/g,'');if(!/^(\+94|0094|94|0)?\d{9}$/.test(d)||/[^\d+]/.test(d))return'Enter a valid Sri Lankan number, e.g. 0771234567.';var n=d.replace(/^(\+94|0094|94|0)/,'');if(!/^[1-9]\d{8}$/.test(n)||/^(\d)\1{7,}$/.test(n.slice(1))||/^(01234567|12345678|23456789|87654321|98765432)$/.test(n.slice(1)))return'Enter a valid Sri Lankan number, e.g. 0771234567.';return''},
email(v){v=String(v||'').trim().toLowerCase();if(!/^[a-z0-9._%+\-]{2,64}@[a-z0-9\-]+(\.[a-z0-9\-]+)*\.[a-z]{2,}$/.test(v)||/\.\./.test(v)||/^(test|asd|abc|xxx|qwe|fake|aaa+)\d*@/.test(v)||/@(example|test|mailinator|yopmail|tempmail|temp-mail|guerrillamail|10minutemail|trashmail|sharklasers|fake|asd|xyz123)\./.test(v))return'Please enter a real email address.';return''},
postal(v){v=String(v||'').trim();return !v||/^\d{5}$/.test(v)?'':'Postal code must be 5 digits.'},
text(v,label,min){v=String(v||'').trim();return v.length<(min||3)||!/\p{L}/u.test(v)||/(.)\1{4,}/u.test(v)?'Please enter a valid '+label+'.':''}};

$("saveEdit").addEventListener("click",async()=>{const f=$("fFirst").value.trim(),l=$("fLast").value.trim();const ve=RV.name(f)||(l&&RV.name(l))||RV.phone($("fPhone").value,1);if(ve){$("stEdit").className="pf-st err";$("stEdit").textContent=ve;return}const name=(f+" "+l).trim();await put({name,phone:$("fPhone").value.trim()},$("saveEdit"),$("stEdit"));try{await updateProfile(user,{displayName:name})}catch(e){}});
$("saveAddr").addEventListener("click",()=>{const ae=RV.text($("fAddress").value,"address",5)||RV.text($("fCity").value,"city",2)||RV.postal($("fPostal").value);if(ae){$("stAddr").className="pf-st err";$("stAddr").textContent=ae;return}put({address:$("fAddress").value.trim(),city:$("fCity").value.trim(),province:$("fProvince").value.trim(),postalCode:$("fPostal").value.trim()},$("saveAddr"),$("stAddr"))});
$("delAddr").addEventListener("click",()=>{if(confirm("Remove this address?"))put({address:"",city:"",province:"",postalCode:""},$("delAddr"),$("stAddr"))});
$("logout").addEventListener("click",async()=>{try{await signOut(auth)}finally{location.href="auth.html"}});
onAuthStateChanged(auth,u=>{if(stop)stop();if(!u){location.replace("auth.html?next=profile.html");return}user=u;stop=onSnapshot(doc(db,"clients",u.uid),s=>{data=s.exists()?s.data():{name:u.displayName||"",email:u.email||""};render()},err=>console.error(err))});
</script>
