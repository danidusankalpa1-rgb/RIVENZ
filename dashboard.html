<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — RIVENZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="home.css">
<style>
body.ord-pg{background:#fff;color:#111827;font-family:Inter,system-ui,sans-serif}
.ord-wrap{max-width:1000px;margin:0 auto;padding:44px 22px 70px;min-height:70vh}
.ord-wrap h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 26px}
.ord-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ord-tabs{display:flex;gap:6px;flex-wrap:wrap}.ord-tabs button{border:0;background:transparent;color:#374151;font:500 14px Inter,sans-serif;padding:10px 18px;border-radius:9px;cursor:pointer}.ord-tabs button.on{background:#eef0ff;color:#4338ca;font-weight:600}
.ord-sel{border:1px solid #d9dbe1;border-radius:10px;background:#fff;font:500 13px Inter,sans-serif;padding:10px 14px;color:#111827;cursor:pointer}
.oc2{border:1px solid #e5e7eb;border-radius:14px;margin-bottom:18px;background:#fff;overflow:hidden}
.oc2-h{display:grid;grid-template-columns:1fr 1fr 1.3fr auto;gap:18px;padding:20px 22px;align-items:start;border-bottom:1px solid #eceef1}
.oc2-h small{display:block;font-size:12px;color:#8b909a;margin-bottom:6px}.oc2-h b{font-size:13px;font-weight:700;color:#111827}
.oc2-r{text-align:right}.oc2-r .no{font-size:14px;color:#8b909a;margin-bottom:10px}.oc2-r .no b{font-size:15px;color:#111827}
.oc2-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.b2{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 18px;border-radius:9px;border:1px solid #d9dbe1;background:#fff;color:#111827;font:500 13px Inter,sans-serif;text-decoration:none;cursor:pointer}
.b2.pri{background:#4f46e5;border-color:#4f46e5;color:#fff}.b2.pri:hover{background:#4338ca}.b2.dng{color:#b42318}.b2.dng:hover{background:#fef3f2}
.oc2-st{padding:18px 22px 4px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:#eef0ff;color:#4338ca}.pill.ok{background:#e9f7ef;color:#1f7a4d}.pill.bad{background:#fdecec;color:#b42318}.pill.wait{background:#fff5dc;color:#9a6500}
.oc2-it{display:flex;gap:18px;padding:16px 22px 20px;align-items:center}.oc2-it+.oc2-it{padding-top:4px}
.oc2-im{width:82px;height:82px;border-radius:10px;background:#f3f4f6;flex:0 0 auto;overflow:hidden}.oc2-im img{width:100%;height:100%;object-fit:cover;display:block}
.oc2-in{min-width:0}.oc2-nm{font-size:15px;font-weight:600;margin-bottom:6px}.oc2-mt{font-size:12.5px;color:#8b909a;margin-bottom:10px}
.oc2-ln{display:flex;gap:14px;font-size:13px;font-weight:500}.oc2-ln a{color:#4f46e5;text-decoration:none}.oc2-ln a:hover{text-decoration:underline}
.ord-empty{text-align:center;color:#8b909a;padding:60px 10px;border:1px dashed #d9dbe1;border-radius:14px;font-size:14px}
@media(max-width:700px){.oc2-h{grid-template-columns:1fr 1fr;gap:14px}.oc2-r{grid-column:1/-1;text-align:left;order:-1}.oc2-btns{justify-content:flex-start}.ord-tabs button{padding:9px 12px;font-size:13px}.oc2-im{width:68px;height:68px}}
</style>
<link rel="stylesheet" href="user-nav.css?v=23">
<script src="public-content.js?v=23"></script>
</head>
<body class="page-ready ord-pg">
<header class="home-header">
  <div class="home-nav-wrap">
    <a class="home-brand" href="index.html" aria-label="RIVENZ home"><img src="logo.png" alt="RIVENZ"></a>
    <button class="home-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
    <nav class="home-nav nav">
      <a href="index.html">Home</a>
      
      <a href="collection.html">Collections</a>
      <a href="weddings.html">Offers</a>
      <a href="dashboard.html" class="nav-profile">My Orders</a>
      <a href="profile.html">My Profile</a>
      <a class="home-login" href="index.html" id="dashboardLogout">Logout</a>
    </nav>
  </div>
</header>
<main class="ord-wrap">
  <h1>Your Orders</h1>
  <div class="ord-bar">
    <div class="ord-tabs" id="ordTabs"><button class="on" data-f="all">Orders</button><button data-f="notshipped">Not Yet Shipped</button><button data-f="delivered">Delivered</button><button data-f="cancelled">Cancelled Orders</button></div>
    <select class="ord-sel" id="ordPeriod"><option value="0">All time</option><option value="30">Past 30 days</option><option value="180">Past 6 months</option><option value="365">Past 1 year</option></select>
  </div>
  <div id="ordersList"><div class="ord-empty">Loading your orders...</div></div>
</main>


<script type="module">
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { collection, doc, getDoc, onSnapshot, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
import { app, db } from "./firebase-config.js";
import "./order-flow.js";
import "./cart-store.js";

const auth=getAuth(app);
const nav=document.querySelector(".home-nav");
const toggle=document.querySelector(".home-menu-toggle");
toggle?.addEventListener("click",()=>{const open=nav?.classList.toggle("open");toggle.setAttribute("aria-expanded",String(!!open));});
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=value=>`Rs. ${Number(value||0).toLocaleString()}`;
function statusClass(status){const s=String(status||"");if(/cancel/i.test(s))return "cancel";if(/deliver|complete/i.test(s))return "green";if(/await|pending/i.test(s))return "pending";return "";}
function progressRank(status,paymentStatus){const s=String(status||"").toLowerCase();if(/deliver|complete/.test(s))return 6;if(/ship/.test(s))return 5;if(/pack/.test(s))return 4;if(/process/.test(s))return 3;if(/order confirmed/.test(s))return 2;if(/payment confirmed/.test(s)||paymentStatus==="Paid"||paymentStatus==="Paid on Delivery")return 1;return 0;}
const hiddenKey=u=>"rvzHiddenOrders:"+u.uid;
function hiddenSet(u){try{return new Set(JSON.parse(localStorage.getItem(hiddenKey(u))||"[]").map(String))}catch(e){return new Set()}}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-rm]");if(!b)return;e.preventDefault();e.stopPropagation();const u=dashboardUser;if(!u||!confirm("Remove this order from your list?"))return;const id=b.dataset.rm;const h=hiddenSet(u);h.add(id);try{localStorage.setItem(hiddenKey(u),JSON.stringify([...h]))}catch(_){}try{await updateDoc(doc(db,"orders",id),{customerHidden:true})}catch(_){}render(u)},true);
async function getOrders(user){try{const all=await graphicsOrderFlow.orders();return all.filter(order=>String(order.uid||"")===String(user.uid)||( !order.uid && String(order.email||"").toLowerCase()===String(user.email||"").toLowerCase()));}catch(error){console.error("Could not load orders:",error);return [];}}
let dashboardUser=null,stopOrderWatch=null,ALL=[],FILTER="all";
const isDone=s=>/deliver|complete/i.test(String(s||"")),isCan=s=>/cancel|reject/i.test(String(s||""));
function cls(s){return isCan(s)?"bad":isDone(s)?"ok":/await|pending/i.test(String(s||""))?"wait":""}
function paint(){
  const days=Number(document.getElementById("ordPeriod").value)||0,now=Date.now();
  let list=ALL.filter(o=>!days||now-new Date(o.createdAt||0).getTime()<=days*864e5);
  if(FILTER==="notshipped")list=list.filter(o=>!isDone(o.status)&&!isCan(o.status)&&!/ship/i.test(String(o.status||"")));
  else if(FILTER==="delivered")list=list.filter(o=>isDone(o.status));
  else if(FILTER==="cancelled")list=list.filter(o=>isCan(o.status));
  const box=document.getElementById("ordersList");
  if(!list.length){box.innerHTML='<div class="ord-empty">'+(ALL.length?"No orders in this view.":"No orders yet. Place your first RIVENZ order to see it here.")+'</div>';return}
  box.innerHTML=list.map(o=>{
    const items=o.items||o.products||[],status=o.status||"Awaiting Payment",locked=isDone(status)&&/complete/i.test(status)||isCan(status);
    const date=o.createdAt?new Date(o.createdAt).toLocaleDateString("en-LK",{day:"2-digit",month:"short",year:"numeric"}):"";
    const ship=[o.city,o.province].filter(Boolean).join(", ")||"—";
    const btns=locked?`<button type="button" class="b2 dng" data-rm="${esc(o.id||"")}">Remove</button>`:`<a class="b2 pri" href="order-details.html?id=${encodeURIComponent(o.id||"")}">View Order</a>`;
    const rows=items.length?items.map(it=>{const im=it.image||it.img||(it.images&&it.images[0]&&it.images[0].url)||"",nm=it.productName||it.name||it.title||"RIVENZ Product",pid=it.productId||"";const mt=[it.size?"Size: "+it.size:"",it.color?"Colour: "+it.color:"","Qty: "+Math.max(1,Number(it.quantity)||1)].filter(Boolean).join("  ·  ");const lk=pid?"services.html?product="+encodeURIComponent(pid):"collection.html";return `<div class="oc2-it"><div class="oc2-im">${im?`<img src="${esc(im)}" alt="" loading="lazy">`:""}</div><div class="oc2-in"><div class="oc2-nm">${esc(nm)}</div><div class="oc2-mt">${esc(mt)}</div><div class="oc2-ln"><a href="${lk}">Buy it again</a><a href="${lk}">View Product</a></div></div></div>`}).join(""):'<div class="oc2-it"><div class="oc2-in oc2-mt">RIVENZ Order</div></div>';
    return `<article class="oc2"><div class="oc2-h"><div><small>Order Date :</small><b>${esc(date)}</b></div><div><small>Total Amount :</small><b>${money(o.total)}</b></div><div><small>Ship To :</small><b>${esc(ship)}</b></div><div class="oc2-r"><div class="no">Order : <b>#${esc(o.id||"")}</b></div><div class="oc2-btns">${btns}</div></div></div><div class="oc2-st">${esc(status)}<span class="pill ${cls(status)}">${esc(o.paymentMethod||"Payment pending")}</span></div>${rows}</article>`}).join("");
}
async function render(user){
  const hid=hiddenSet(user);
  ALL=(await getOrders(user)).filter(o=>!hid.has(String(o.id))&&!o.customerHidden).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
  paint();
}
document.getElementById("ordTabs").addEventListener("click",e=>{const b=e.target.closest("button[data-f]");if(!b)return;FILTER=b.dataset.f;document.querySelectorAll("#ordTabs button").forEach(x=>x.classList.toggle("on",x===b));paint()});
document.getElementById("ordPeriod").addEventListener("change",paint);
function watchCustomerOrders(user){if(stopOrderWatch)stopOrderWatch();try{stopOrderWatch=onSnapshot(query(collection(db,"orders"),where("uid","==",user.uid)),()=>render(user),err=>console.warn("Order watch unavailable:",err))}catch(e){}}
document.getElementById("dashboardLogout")?.addEventListener("click",async e=>{e.preventDefault();try{await signOut(auth);}catch(error){console.error("Logout failed:",error);}location.href="index.html";});
onAuthStateChanged(auth,user=>{if(!user){if(stopOrderWatch)stopOrderWatch();location.replace("auth.html?next=dashboard.html");return;}dashboardUser=user;render(user);watchCustomerOrders(user);});
</script>
<script type="module" src="account-guard.js?v=23"></script>
<script type="module" src="user-nav.js?v=23"></script>
</body>
</html>
