<script type="module">
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { collection, doc, getDoc, onSnapshot, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
import { app, db } from "./firebase-config.js";
import "./order-flow.js";
import "./cart-store.js";

const auth=getAuth(app);
const nav=document.querySelector(".home-nav");
const toggle=document.querySelector(".home-menu-toggle");
toggle?.addEventListener("click",()=>{const open=nav?.classList.toggle("open");toggle.setAttribute("aria-expanded",String(!!open));});
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=value=>`Rs. ${Number(value||0).toLocaleString()}`;
const hiddenKey=u=>"rvzHiddenOrders:"+u.uid;
function hiddenSet(u){try{return new Set(JSON.parse(localStorage.getItem(hiddenKey(u))||"[]").map(String))}catch(e){return new Set()}}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-rm]");if(!b)return;e.preventDefault();e.stopPropagation();const u=dashboardUser;if(!u||!confirm("Remove this order from your list?"))return;const id=b.dataset.rm;const h=hiddenSet(u);h.add(id);try{localStorage.setItem(hiddenKey(u),JSON.stringify([...h]))}catch(_){}try{await updateDoc(doc(db,"orders",id),{customerHidden:true})}catch(_){}render(u)},true);
async function getOrders(user){try{const all=await graphicsOrderFlow.orders();return all.filter(order=>String(order.uid||"")===String(user.uid)||( !order.uid && String(order.email||"").toLowerCase()===String(user.email||"").toLowerCase()));}catch(error){console.error("Could not load orders:",error);return [];}}
let dashboardUser=null,stopOrderWatch=null,ALL=[],FILTER="all",PERIOD=0;
const isDone=s=>/deliver|complete/i.test(String(s||"")),isCan=s=>/cancel|reject/i.test(String(s||""));
function cls(s){return isCan(s)?"bad":isDone(s)?"ok":/await|pending/i.test(String(s||""))?"wait":""}
function paint(){
  const days=PERIOD,now=Date.now();
  let list=ALL.filter(o=>!days||now-new Date(o.createdAt||0).getTime()<=days*864e5);
  if(FILTER==="notshipped")list=list.filter(o=>!isDone(o.status)&&!isCan(o.status)&&!/ship/i.test(String(o.status||"")));
  else if(FILTER==="delivered")list=list.filter(o=>isDone(o.status));
  else if(FILTER==="cancelled")list=list.filter(o=>isCan(o.status));
  document.getElementById("ordSum").textContent=list.length+(list.length===1?" order":" orders");
  const box=document.getElementById("ordersList");
  if(!list.length){box.innerHTML='<div class="ord-empty">'+(ALL.length?"No orders in this view.":"No orders yet. Place your first RIVENZ order to see it here.")+'</div>';return}
  box.innerHTML=list.map(o=>{
    const items=o.items||o.products||[],status=o.status||"Awaiting Payment",locked=isDone(status)&&/complete/i.test(status)||isCan(status);
    const date=o.createdAt?new Date(o.createdAt).toLocaleDateString("en-LK",{day:"2-digit",month:"short",year:"numeric"}):"";
    const prov=String(o.province||"").trim().replace(/\s*province$/i,""),ship=[o.city,prov?prov+" Province":""].filter(Boolean).join(", ")||"—";
    const btns=locked?`<button type="button" class="oc3-b dng" data-rm="${esc(o.id||"")}">Remove</button>`:`<a class="oc3-b" href="order-details.html?id=${encodeURIComponent(o.id||"")}">View order</a>`;
    const qty=items.reduce((n,it)=>n+Math.max(1,Number(it.quantity)||1),0);
    const th=items.slice(0,3).map(it=>{const im=it.image||it.img||(it.images&&it.images[0]&&it.images[0].url)||"";return `<span class="oc3-im">${im?`<img src="${esc(im)}" alt="" loading="lazy">`:""}</span>`}).join("")+(items.length>3?`<span class="oc3-more">+${items.length-3}</span>`:"");
    const names=items.map(it=>it.productName||it.name||it.title||"RIVENZ Product").slice(0,2).join(", ")+(items.length>2?" +"+(items.length-2)+" more":"");
    return `<article class="oc3"><div class="oc3-th">${th||'<span class="oc3-im"></span>'}</div><div class="oc3-in"><b>#${esc(o.id||"")}</b><span>${esc(names||"RIVENZ Order")}</span><small>${esc(date)} &middot; ${qty||items.length} item${(qty||items.length)===1?"":"s"}</small></div><div class="oc3-st ${cls(status)}">${esc(status)}</div><div class="oc3-ac" data-t="${esc(money(o.total))}">${btns}</div></article>`}).join("");
}
async function render(user){
  const hid=hiddenSet(user);
  ALL=(await getOrders(user)).filter(o=>!hid.has(String(o.id))&&!o.customerHidden).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
  paint();
}
function renderWishlist(){
  const box=document.getElementById("wishlistBox");if(!box)return;let list=[];try{list=JSON.parse(localStorage.getItem((()=>{try{return 'rivenzWishlistV1:'+(window.rivenzCartStore&&window.rivenzCartStore.uid||'guest')}catch(e){return 'rivenzWishlistV1:guest'}})())||"[]")}catch(e){}
  if(!Array.isArray(list)||!list.length){box.innerHTML='<div class="empty">Your wishlist is empty. Tap the heart on any product in the Shop to save it here.</div>';return;}
  box.innerHTML='<div class="wishlist-grid">'+list.map(item=>{const price=Number(item.offer||0)>0?item.offer:item.price;const old=Number(item.offer||0)>0&&Number(item.price||0)>0?'<span style="color:#9a9da2;text-decoration:line-through;margin-left:5px">'+money(item.price)+'</span>':'';const image=item.image?'<img src="'+esc(item.image)+'" alt="">':'<div class="wishlist-placeholder">RIVENZ</div>';return '<div class="wishlist-item">'+image+'<div class="wishlist-info"><div class="wishlist-name">'+esc(item.name||"RIVENZ Product")+'</div><div class="wishlist-price"><strong>'+money(price)+'</strong>'+old+'</div><div class="wishlist-actions"><a href="'+(item.id?'services.html?product='+encodeURIComponent(item.id):'index.html')+'">View</a><button type="button" data-wish-remove="'+esc(item.id||'')+'">Remove</button></div></div></div>'}).join('')+'</div>';
  box.querySelectorAll('[data-wish-remove]').forEach(btn=>btn.addEventListener('click',()=>{const id=btn.getAttribute('data-wish-remove');list=list.filter(x=>String(x.id)!==String(id));localStorage.setItem((()=>{try{return 'rivenzWishlistV1:'+(window.rivenzCartStore&&window.rivenzCartStore.uid||'guest')}catch(e){return 'rivenzWishlistV1:guest'}})(),JSON.stringify(list));renderWishlist();}));
}
window.addEventListener('rivenz-cart-session-changed',renderWishlist);renderWishlist();window.addEventListener('storage',renderWishlist);window.addEventListener('rivenz:wishlist-change',renderWishlist);
{const btn=document.getElementById("ofBtn"),menu=document.getElementById("ofMenu"),lbl=document.getElementById("ofLbl");
const NAMES={all:"All orders",notshipped:"Not yet shipped",delivered:"Delivered",cancelled:"Cancelled"};
const shut=()=>{menu.hidden=true;btn.setAttribute("aria-expanded","false");btn.classList.remove("open")};
btn.addEventListener("click",e=>{e.stopPropagation();const o=menu.hidden;menu.hidden=!o;btn.setAttribute("aria-expanded",String(o));btn.classList.toggle("open",o)});
document.addEventListener("click",e=>{if(!menu.contains(e.target)&&e.target!==btn)shut()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")shut()});
