<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chat — RIVENZ Clothing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css">
  <style>
    body{background:#fbfbfa;color:#15171b}
    .chat-page{max-width:760px;margin:0 auto;padding:18px 16px 18px;height:calc(100vh - 78px);height:calc(100dvh - 78px);min-height:480px;display:flex;flex-direction:column}
    .chat-card{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid #e9eaed;border-radius:26px;box-shadow:0 15px 40px rgba(20,24,30,.05);overflow:hidden}
    .ci{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .ch{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #f0f0ed}
    .ch-av{width:44px;height:44px;border-radius:50%;background:#111316;color:#fff;display:grid;place-items:center}
    .ch strong{display:block;font-size:15px}.ch small{display:block;font-size:12px;color:#747983;margin-top:2px}
    .cmsgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px;background:#fafaf8}
    .mb{max-width:80%;display:flex;flex-direction:column;gap:4px}
    .mb.user{align-self:flex-end;align-items:flex-end}.mb.admin{align-self:flex-start}
    .bub{border-radius:20px;padding:10px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
    .mb.user .bub{background:#111316;color:#fff;border-bottom-right-radius:6px}
    .mb.admin .bub{background:#fff;color:#15171b;border:1px solid #e6e6e1;border-bottom-left-radius:6px}
    .mb small{font-size:10.5px;color:#9a9a96;padding:0 4px;display:flex;gap:8px;align-items:center}
    .mb .del{border:0;background:none;color:#9a9a96;cursor:pointer;padding:0;display:inline-flex}.mb .del .ci{width:14px;height:14px}.mb .del:hover{color:#d4483b}
    .ref{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;background:rgba(127,127,127,.12);border-radius:14px;padding:8px;margin-bottom:6px;min-width:200px}
    .mb.user .ref{background:rgba(255,255,255,.14)}
    .ref-i{width:44px;height:44px;border-radius:10px;background:#e9e9e5;overflow:hidden;display:grid;place-items:center;flex:none;color:#555}.ref-i img{width:100%;height:100%;object-fit:cover}
    .ref b{display:block;font-size:12.5px}.ref b+span{display:block;font-size:11.5px;opacity:.7;margin-top:2px}
    .cempty{margin:auto;text-align:center;color:#9a9a96;font-size:13px}.cempty .ci{width:34px;height:34px;color:#c9c9c4;display:block;margin:0 auto 10px}
    .pick{border-top:1px solid #f0f0ed;background:#fff;padding:10px 14px}
    .pick-chip{display:flex;align-items:center;gap:10px;background:#f4f4f1;border-radius:14px;padding:8px 10px}
    .pick-chip .ref-i{width:38px;height:38px}.pick-chip div{flex:1;min-width:0}.pick-chip b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pick-chip span{font-size:11.5px;color:#747983}
    .xbtn{border:0;background:#e6e6e1;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;cursor:pointer;padding:0;color:#111}.xbtn .ci{width:14px;height:14px}
    .cc{display:flex;gap:8px;align-items:flex-end;padding:12px 14px;border-top:1px solid #f0f0ed;background:#fff}
    .cc textarea{flex:1;resize:none;max-height:120px;border:1px solid #e3e3de;background:#fafaf8;border-radius:18px;padding:12px 14px;font:inherit;font-size:14px;outline:none;line-height:1.4}
    .cc textarea:focus{border-color:#111316}
    .rb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;border:1px solid #e3e3de;background:#fff;color:#111316}
    .rb.dark{background:#111316;border-color:#111316;color:#fff}.rb:disabled{opacity:.4}
    .sheet-bg{position:fixed;inset:0;background:rgba(17,17,17,.42);z-index:3000;display:none;align-items:flex-end;justify-content:center}
    .sheet-bg.open{display:flex}
    .sheet{width:min(560px,100%);max-height:78vh;background:#fff;border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding:16px}
    .sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheet-h h3{margin:0;font-size:16px}
    .tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;border:1px solid #e3e3de;background:#fff;border-radius:14px;padding:10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;color:#555}
    .tab.on{background:#111316;border-color:#111316;color:#fff}
    .sheet input{width:100%;border:1px solid #e3e3de;background:#fafaf8;border-radius:14px;padding:11px 14px;font:inherit;font-size:13px;outline:none;margin-bottom:10px}
    .plist{overflow-y:auto;display:grid;gap:8px}
    .pit{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid #efefeb;background:#fff;border-radius:16px;padding:10px;cursor:pointer;font:inherit;color:inherit}.pit:hover{background:#f8f8f6}
    .pit b{display:block;font-size:13px}.pit span{font-size:12px;color:#747983}
    @media(max-width:600px){.chat-page{padding:10px 10px 10px}.chat-card{border-radius:20px}.mb{max-width:88%}}
  </style>
<link rel="stylesheet" href="user-nav.css">
</head>
<body class="page-ready">
<header class="home-header">
  <div class="home-nav-wrap">
    <a class="home-brand" href="index.html" aria-label="RIVENZ home"><img src="logo.png" alt="RIVENZ"></a>
    <nav class="home-nav nav">
      <a href="index.html">Home</a><a href="services.html">Shop</a><a href="portfolio.html">Collections</a><a href="weddings.html">Offers</a>
      <a class="active" href="chat.html">Chat</a><a href="cart.html">Cart</a><a href="dashboard.html">My Dashboard</a>
    </nav>
  </div>
</header>
<main class="chat-page"><div class="chat-card" id="card">
  <div class="ch"><span class="ch-av"><svg class="ci" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg></span><div><strong>RIVENZ Admin</strong><small>Ask us about a product or your order</small></div></div>
  <div class="cmsgs" id="msgs"><div class="cempty">Loading…</div></div>
  <div class="pick" id="pick" hidden></div>
  <div class="cc"><button type="button" class="rb" id="plus" aria-label="Mention a product or order"><svg class="ci" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><textarea id="text" rows="1" placeholder="Write a message" maxlength="2000"></textarea><button type="button" class="rb dark" id="send" aria-label="Send"><svg class="ci" viewBox="0 0 24 24"><path d="m22 2-11 11M22 2l-7 20-4-9-9-4z"/></svg></button></div>
</div></main>
<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-label="Mention">
  <div class="sheet-h"><h3>Mention in your message</h3><button type="button" class="xbtn" id="sheetX" aria-label="Close"><svg class="ci" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="tabs"><button type="button" class="tab on" data-t="product"><svg class="ci" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>Product</button><button type="button" class="tab" data-t="order"><svg class="ci" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>My order</button></div>
  <input id="sheetQ" type="search" placeholder="Search" autocomplete="off"><div class="plist" id="plist"></div>
</div></div>
<script src="public-content.js"></script>
<script type="module">
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { collection, doc, getDoc, onSnapshot, query, orderBy, addDoc, setDoc, deleteDoc, writeBatch, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
import { app, db } from "./firebase-config.js";
import "./order-flow.js";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICON = (p) => `<svg class="ci" viewBox="0 0 24 24">${p}</svg>`;
const BAG = ICON('<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>');
const TRASH = ICON('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>');
const money = (n) => "Rs. " + Number(n || 0).toLocaleString("en-LK");
const ms = (v) => v?.toMillis ? v.toMillis() : (typeof v === "number" ? v : 0);
const when = (t) => t ? new Date(t).toLocaleString("en-LK", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
let user = null, profile = {}, msgs = [], picked = null, tab = "product", products = null, orders = null;

function refHtml(r) {
  if (!r) return "";
  if (r.type === "order") return `<a class="ref" href="order-details.html?id=${encodeURIComponent(r.id)}"><span class="ref-i">${BAG}</span><span><b>Order ${esc(r.id)}</b><span>${esc(r.status || "")}${r.total ? " · " + money(r.total) : ""}</span></span></a>`;
  return `<span class="ref"><span class="ref-i">${r.image ? `<img src="${esc(r.image)}" alt="">` : BAG}</span><span><b>${esc(r.name || "Product")}</b><span>${r.price ? money(r.price) : ""}</span></span></span>`;
}
function render() {
  const box = $("msgs");
  box.innerHTML = msgs.length ? msgs.map((m) => {
    const mine = m.sender === "user", canDel = mine && m.seenByAdmin !== true;
    return `<div class="mb ${mine ? "user" : "admin"}"><div class="bub">${refHtml(m.ref)}${esc(m.text || "")}</div><small>${esc(when(ms(m.createdAt)))}${mine && m.seenByAdmin ? " · Seen" : ""}${canDel ? `<button type="button" class="del" data-del="${esc(m.id)}" aria-label="Delete message">${TRASH}</button>` : ""}</small></div>`;
  }).join("") : `<div class="cempty">${ICON('<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/><path d="M8 10h8M8 14h5"/>')}Say hello. Ask about a product or one of your orders.</div>`;
  box.scrollTop = box.scrollHeight;
}
function renderPick() {
  const p = $("pick"); p.hidden = !picked;
  if (picked) p.innerHTML = `<div class="pick-chip"><span class="ref-i">${picked.image ? `<img src="${esc(picked.image)}" alt="">` : BAG}</span><div><b>${picked.type === "order" ? "Order " + esc(picked.id) : esc(picked.name)}</b><span>${picked.type === "order" ? esc(picked.status || "") : (picked.price ? money(picked.price) : "")}</span></div><button type="button" class="xbtn" id="pickX" aria-label="Remove">${ICON('<path d="M6 6l12 12M18 6 6 18"/>')}</button></div>`;
}
async function send() {
  const t = $("text"), text = t.value.trim();
  if ((!text && !picked) || !user) return;
  $("send").disabled = true;
  const ref = picked; t.value = ""; picked = null; renderPick(); t.style.height = "auto";
  try {
    const data = { sender: "user", text, createdAt: serverTimestamp(), seenByAdmin: false, seenByUser: true };
    if (ref) data.ref = ref;
    await addDoc(collection(db, "chats", user.uid, "messages"), data);
    await setDoc(doc(db, "chats", user.uid), { uid: user.uid, name: profile.name || user.displayName || "", email: profile.email || user.email || "", lastMessage: text || (ref?.type === "order" ? "Order " + ref.id : ref?.name || "Shared an item"), lastAt: serverTimestamp(), lastSender: "user", unreadAdmin: increment(1) }, { merge: true });
  } catch (e) { console.error(e); t.value = text; picked = ref; renderPick(); alert("Could not send your message. Please try again."); }
  $("send").disabled = false; t.focus();
}
async function openSheet() { $("sheetBg").classList.add("open"); $("sheetQ").value = ""; await loadSheet(); }
async function loadSheet() {
  const list = $("plist"), q = $("sheetQ").value.trim().toLowerCase();
  list.innerHTML = '<div class="cempty">Loading…</div>';
  try {
    if (tab === "product") {
      if (!products) products = await window.graphicsPublicContent.catalog("products");
      const rows = products.filter((p) => p.active !== false && (!q || String(p.name || "").toLowerCase().includes(q)));
      list.innerHTML = rows.length ? rows.map((p, i) => { const img = p.images?.[0]?.url || p.image?.url || (typeof p.image === "string" ? p.image : ""); return `<button type="button" class="pit" data-p="${i}"><span class="ref-i">${img ? `<img src="${esc(img)}" alt="">` : BAG}</span><span><b>${esc(p.name)}</b><span>${money(p.offer || p.price)}</span></span></button>`; }).join("") : '<div class="cempty">No products found.</div>';
      list.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => { const p = rows[b.dataset.p]; picked = { type: "product", id: String(p.id), name: p.name, price: p.offer || p.price || 0, image: p.images?.[0]?.url || p.image?.url || (typeof p.image === "string" ? p.image : "") }; closeSheet(); renderPick(); $("text").focus(); });
    } else {
      if (!orders) { await graphicsOrderFlow.ready; orders = await graphicsOrderFlow.orders(); }
      const rows = orders.filter((o) => !q || String(o.id).toLowerCase().includes(q));
      list.innerHTML = rows.length ? rows.map((o, i) => `<button type="button" class="pit" data-o="${i}"><span class="ref-i">${BAG}</span><span><b>${esc(o.id)}</b><span>${esc(o.status || "")} · ${money(o.total)}</span></span></button>`).join("") : '<div class="cempty">You have no orders yet.</div>';
      list.querySelectorAll("[data-o]").forEach((b) => b.onclick = () => { const o = rows[b.dataset.o]; picked = { type: "order", id: o.id, status: o.status || "", total: Number(o.total || 0) }; closeSheet(); renderPick(); $("text").focus(); });
    }
  } catch (e) { console.warn(e); list.innerHTML = '<div class="cempty">Could not load the list.</div>'; }
}
function closeSheet() { $("sheetBg").classList.remove("open"); }

$("send").onclick = send; $("plus").onclick = openSheet; $("sheetX").onclick = closeSheet;
$("sheetBg").onclick = (e) => { if (e.target.id === "sheetBg") closeSheet(); };
$("sheetQ").oninput = loadSheet;
document.querySelectorAll(".tab").forEach((b) => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b)); loadSheet(); });
$("pick").onclick = (e) => { if (e.target.closest("#pickX")) { picked = null; renderPick(); } };
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("text").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = Math.min(120, e.target.scrollHeight) + "px"; });
$("msgs").onclick = async (e) => { const d = e.target.closest("[data-del]"); if (!d || !confirm("Delete this message?")) return; try { await deleteDoc(doc(db, "chats", user.uid, "messages", d.dataset.del)); } catch (err) { alert("This message was already seen, so it can no longer be deleted."); } };

onAuthStateChanged(getAuth(app), async (u) => {
  if (!u) { location.replace("auth.html?next=" + encodeURIComponent("chat.html")); return; }
  user = u;
  try { const s = await getDoc(doc(db, "clients", u.uid)); profile = s.exists() ? s.data() : {}; } catch (_) {}
  onSnapshot(query(collection(db, "chats", u.uid, "messages"), orderBy("createdAt")), (snap) => {
    msgs = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render();
    const unseen = snap.docs.filter((d) => d.data().sender === "admin" && d.data().seenByUser !== true && !d.metadata.hasPendingWrites);
    if (unseen.length) { const b = writeBatch(db); unseen.forEach((d) => b.update(d.ref, { seenByUser: true })); b.commit().catch(() => {}); setDoc(doc(db, "chats", u.uid), { unreadUser: 0 }, { merge: true }).catch(() => {}); }
  }, () => { $("msgs").innerHTML = '<div class="cempty">Chat is temporarily unavailable.</div>'; });
});
</script>
<script type="module" src="account-guard.js"></script>
<script type="module" src="user-nav.js"></script>
</body>
</html>
